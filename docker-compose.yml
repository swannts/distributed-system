services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: chat-server-node-1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ID=node-1
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: chat-client
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - server
